name: mathcheck

services:
  mathcheck:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mathcheck
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen3-vl:4b-instruct}
      OLLAMA_SOLVER_MODEL: ${OLLAMA_SOLVER_MODEL:-qwen3-vl:4b-instruct}
      OLLAMA_GRADER_MODEL: ${OLLAMA_GRADER_MODEL:-qwen3-vl:4b-instruct}
      OLLAMA_REVIEWER_MODEL: ${OLLAMA_REVIEWER_MODEL:-qwen3-vl:4b-instruct}
      OLLAMA_CONNECT_TIMEOUT_SECONDS: ${OLLAMA_CONNECT_TIMEOUT_SECONDS:-15}
      OLLAMA_IDLE_TIMEOUT_SECONDS: ${OLLAMA_IDLE_TIMEOUT_SECONDS:-180}
      OLLAMA_VISION_TOTAL_TIMEOUT_SECONDS: ${OLLAMA_VISION_TOTAL_TIMEOUT_SECONDS:-900}
      OLLAMA_TEXT_TOTAL_TIMEOUT_SECONDS: ${OLLAMA_TEXT_TOTAL_TIMEOUT_SECONDS:-300}
      MATHCHECK_OBS_DIR: /app/observability
      MATHCHECK_SLOW_AGENT_SECONDS: ${MATHCHECK_SLOW_AGENT_SECONDS:-120}
      MATHCHECK_OTEL_ENABLED: ${MATHCHECK_OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: mathcheck-ai
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./observability:/app/observability
    depends_on:
      - otel-collector
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.131.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/observability/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on:
      - loki
      - jaeger
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - otel-collector
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./deploy/observability/loki.yml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.9.0
    ports:
      - "127.0.0.1:16686:16686"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-mathcheck-local-demo}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./deploy/observability/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
      - jaeger
    restart: unless-stopped

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
