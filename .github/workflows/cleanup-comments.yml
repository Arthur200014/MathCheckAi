name: Clean code comments

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/strip_comments.py'
      - '.github/workflows/cleanup-comments.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/strip_comments.py
      - run: python -m compileall -q src evals tests
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Arthur200014"
          git config user.email "103813672+Arthur200014@users.noreply.github.com"
          git add -A
          git commit -m "Clean code comments"
          git push origin main
