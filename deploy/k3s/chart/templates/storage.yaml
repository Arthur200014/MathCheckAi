apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-shared
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.sharedStorage.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.sharedStorage.size | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-backups
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.backup.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.backup.size | quote }}
