replicaCount: 2
image:
  repository: mathcheck-ai
  tag: k3s
  pullPolicy: Never
ollama:
  baseUrl: http://ollama:11434
database:
  instances: 2
  storageClass: local-path
  storage: 5Gi
  imageName: ghcr.io/cloudnative-pg/postgresql:17
sharedStorage:
  storageClass: local-path
  size: 2Gi
backup:
  schedule: "0 */6 * * *"
  storageClass: local-path
  size: 5Gi
  image: postgres:17
